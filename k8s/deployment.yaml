apiVersion: apps/v1
kind: Deployment
metadata:
  name: techoffice-cockpit-api
  namespace: techoffice
  labels:
    app: techoffice-cockpit
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: techoffice-cockpit
      component: api
  template:
    metadata:
      labels:
        app: techoffice-cockpit
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: techoffice-cockpit:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: techoffice-secrets
                  key: anthropic-api-key
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: techoffice-secrets
                  key: jira-api-token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techoffice-secrets
                  key: postgres-password
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: techoffice-config
                  key: qdrant-host
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: techoffice-config
                  key: postgres-host
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techoffice-cockpit-worker
  namespace: techoffice
  labels:
    app: techoffice-cockpit
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techoffice-cockpit
      component: worker
  template:
    metadata:
      labels:
        app: techoffice-cockpit
        component: worker
    spec:
      containers:
        - name: worker
          image: techoffice-cockpit:latest
          command: ["celery", "-A", "src.tasks", "worker", "--loglevel=info", "--concurrency=4"]
          env:
            - name: APP_ENV
              value: "production"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: techoffice-secrets
                  key: anthropic-api-key
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
